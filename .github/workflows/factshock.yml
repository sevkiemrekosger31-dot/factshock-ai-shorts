
name: FactShock AI - 2 Daily Shorts

on:
  workflow_dispatch:
  schedule:
    - cron: '0 15 * * *'
    - cron: '0 23 * * *'
permissions:
  contents: write

concurrency:
  group: factshock-video-production
  cancel-in-progress: false

jobs:
  create-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install anthropic openai
          python -m pip install google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2

      - name: Generate FactShock video
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python generate_short.py

      - name: Validate generated video
        run: |
          test -s output/short.mp4
          test -s output/script.txt
          test -s output/youtube_metadata.json
          test -s output/fact_check.json
          test -s fact_history.json
          ffprobe -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            output/short.mp4
          ls -lh output/short.mp4

      - name: Save generated video
        uses: actions/upload-artifact@v4
        with:
          name: factshock-short-${{ github.run_id }}
          path: |
            output/short.mp4
            output/script.txt
            output/youtube_metadata.json
            output/fact_check.json
          retention-days: 7

      - name: Upload video to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: public
        run: python upload_youtube.py

      - name: Save completed topic history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add fact_history.json

          if ! git diff --cached --quiet; then
            git commit -m "Update FactShock topic history"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Print success message
        run: |
          echo "FACTSHOCK AI VIDEO COMPLETED"
          echo "Video uploaded privately to YouTube"
          echo "Topic history saved"
