name: FactShock AI - 2 Daily Shorts

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish this video to YouTube?'
        required: true
        type: boolean
        default: false
  schedule:
    - cron: '0 15 * * *'
    - cron: '0 23 * * *'

permissions:
  contents: write

concurrency:
  group: factshock-video-production
  cancel-in-progress: false

jobs:
  create-and-upload:
    # Scheduled uploads are ON; manual runs default to preview only.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'openai>=1.75,<3' google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2

      - name: Generate video
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
          IMAGE_MODEL: gpt-image-1-mini
          TTS_MODEL: gpt-4o-mini-tts
        run: python generate_short.py

      - name: Validate video and metadata
        run: |
          set -euo pipefail
          test -s output/short.mp4
          test -s output/script.txt
          test -s output/youtube_metadata.json
          test -s output/fact_check.json
          test -s output/next_fact_history.json
          test -s output/quality_report.json
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          d=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=noprint_wrappers=1:nokey=1','output/short.mp4'],text=True))
          assert 45 <= d <= 55, f'Bad duration: {d:.2f}s'
          m=json.loads(Path('output/youtube_metadata.json').read_text())
          assert m['title'] and m['description']
          q=json.loads(Path('output/quality_report.json').read_text())
          assert q['passed'] and q['audio_present']
          print(f'Validated: {d:.2f}s')
          PY

      - name: Save preview
        uses: actions/upload-artifact@v4
        with:
          name: factshock-preview-${{ github.run_id }}
          path: |
            output/short.mp4
            output/script.txt
            output/youtube_metadata.json
            output/fact_check.json
            output/subtitles.ass
            output/caption_qc.json
            output/quality_report.json
          retention-days: 7

      - name: Upload to YouTube
        if: github.event_name == 'schedule' || inputs.publish == true
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: public
        run: python upload_youtube.py

      - name: Save topic history after successful upload
        if: github.event_name == 'schedule' || inputs.publish == true
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python - <<'PYHISTORY'
          import json
          from pathlib import Path
          path=Path('fact_history.json')
          previous=json.loads(path.read_text()) if path.exists() else []
          if isinstance(previous,dict):
              previous=previous.get('used_topics',previous.get('history',previous.get('used',[])))
          if not isinstance(previous,list):
              raise RuntimeError('Unknown history schema; refusing overwrite')
          pending=json.loads(Path('output/next_fact_history.json').read_text())
          if not isinstance(pending,list) or not pending:
              raise RuntimeError('Missing new topic')
          current_id=pending[-1]
          previous=[str(x.get('id',x.get('topic',''))) if isinstance(x,dict) else str(x) for x in previous]
          previous.append(current_id)
          path.write_text(json.dumps(previous[-200:],ensure_ascii=False,indent=2)+'\n')
          PYHISTORY
            git add fact_history.json
            if git diff --cached --quiet; then
              echo 'No history changes needed'
              exit 0
            fi
            git commit -m 'Record published FactShock topic'
            if git push origin HEAD:main; then
              echo 'Published topic saved'
              exit 0
            fi
            echo "History push attempt $attempt failed; retrying"
            sleep $((attempt * 3))
          done
          echo 'WARNING: YouTube upload succeeded but history could not be saved.' >&2
          exit 1

      - name: Complete
        run: echo 'FactShock run completed. Check preview artifact and upload step.'
