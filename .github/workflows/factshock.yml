name: FactShock AI - 2 Daily Shorts

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish this video to YouTube?'
        required: true
        type: boolean
        default: false
  schedule:
    - cron: '0 15 * * *'
    - cron: '0 23 * * *'

permissions:
  contents: write

concurrency:
  group: factshock-video-production
  cancel-in-progress: false

jobs:
  create-and-upload:
    # Keep schedules OFF until preview is approved and repo variable is set to true.
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_AUTO_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'openai>=1.75,<3' google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2

      - name: Generate video
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
          IMAGE_MODEL: gpt-image-1-mini
          TTS_MODEL: gpt-4o-mini-tts
        run: python generate_short.py

      - name: Validate video and metadata
        run: |
          set -euo pipefail
          test -s output/short.mp4
          test -s output/script.txt
          test -s output/youtube_metadata.json
          test -s output/fact_check.json
          test -s fact_history.json
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          d=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=noprint_wrappers=1:nokey=1','output/short.mp4'],text=True))
          assert 45 <= d <= 55, f'Bad duration: {d:.2f}s'
          m=json.loads(Path('output/youtube_metadata.json').read_text())
          assert m['title'] and m['description']
          print(f'Validated: {d:.2f}s')
          PY

      - name: Save preview
        uses: actions/upload-artifact@v4
        with:
          name: factshock-preview-${{ github.run_id }}
          path: |
            output/short.mp4
            output/script.txt
            output/youtube_metadata.json
            output/fact_check.json
            output/subtitles.ass
          retention-days: 7

      - name: Upload to YouTube
        if: github.event_name == 'schedule' || inputs.publish == true
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: public
        run: python upload_youtube.py

      - name: Save topic history
        if: github.event_name == 'schedule' || inputs.publish == true
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fact_history.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update FactShock topic history'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Complete
        run: echo 'FactShock run completed. Check preview artifact and upload step.'
