
name: FactShock AI - 2 Daily Shorts

on:
  workflow_dispatch:
  schedule:
    # 15:00 and 23:00 UTC
    # Turkey: 18:00 and 02:00
    - cron: '0 15,23 * * *'

permissions:
  contents: read

concurrency:
  group: factshock-video-production
  cancel-in-progress: false

jobs:
  create-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install anthropic openai
          python -m pip install google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2

      - name: Generate FactShock video
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python generate_short.py

      - name: Verify generated video
        run: |
          test -s output/short.mp4
          test -s output/youtube_metadata.json
          ls -lh output/short.mp4

      - name: Save video artifact
        uses: actions/upload-artifact@v4
        with:
          name: factshock-short-${{ github.run_id }}
          path: |
            output/short.mp4
            output/script.txt
            output/youtube_metadata.json
            output/fact_check.json
          retention-days: 7

      - name: Upload to FactShock YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: private
        run: python upload_youtube.py
